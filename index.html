<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b344d">
<title>Barangay Migcanaway Resident Survey and Assistance Tracking System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        brand: {
          50: '#f3f6fb',
          100: '#e6ecf6',
          200: '#c9d7ea',
          300: '#a2b9d8',
          400: '#7595c2',
          500: '#5477ab',
          600: '#3f5283',
          700: '#36456c',
          800: '#2f3b5b',
          900: '#2b344d',
          950: '#1b2133'
        }
      },
      fontFamily: {
        sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'Segoe UI', 'sans-serif']
      },
      boxShadow: {
        card: '0 1px 2px 0 rgb(15 23 42 / 0.04), 0 10px 30px -18px rgb(15 23 42 / 0.25)'
      },
      keyframes: {
        'toast-in': {
          '0%': { opacity: '0', transform: 'translate(-50%, 10px)' },
          '100%': { opacity: '1', transform: 'translate(-50%, 0)' }
        },
        'fade-up': {
          '0%': { opacity: '0', transform: 'translateY(8px)' },
          '100%': { opacity: '1', transform: 'translateY(0)' }
        },
        'grow-y': {
          '0%': { transform: 'scaleY(0)' },
          '100%': { transform: 'scaleY(1)' }
        },
        'grow-x': {
          '0%': { transform: 'scaleX(0)' },
          '100%': { transform: 'scaleX(1)' }
        },
        float: {
          '0%': { transform: 'translate(0, 0)' },
          '100%': { transform: 'translate(0, -18px)' }
        }
      },
      animation: {
        'toast-in': 'toast-in 200ms ease-out',
        'fade-up': 'fade-up 300ms ease-out both',
        'grow-y': 'grow-y 600ms cubic-bezier(0.22, 1, 0.36, 1) both',
        'grow-x': 'grow-x 700ms cubic-bezier(0.22, 1, 0.36, 1) both',
        float: 'float 7s ease-in-out infinite alternate'
      }
    }
  }
}
</script>
</head>
<body class="h-full bg-slate-100 font-sans text-slate-800 antialiased">
<div id="app"></div>
<script src="script.js"></script>
</body>
</html>
