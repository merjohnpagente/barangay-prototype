<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f6f2">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/favicon.png">
<title>Barangay Migcanaway, Tangub City · Resident Survey System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        pine: {
          50: '#f2f7f4',
          100: '#dfece6',
          200: '#c3ddd2',
          600: '#1f5a4c',
          700: '#17453b',
          800: '#11342c',
          900: '#0c2822'
        },
        cream: '#f7f6f2'
      },
      fontFamily: {
        sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'Segoe UI', 'sans-serif']
      },
      keyframes: {
        'fade-up': {
          '0%': { opacity: '0', transform: 'translateY(4px)' },
          '100%': { opacity: '1', transform: 'translateY(0)' }
        },
        'grow-y': {
          '0%': { transform: 'scaleY(0)' },
          '100%': { transform: 'scaleY(1)' }
        },
        'grow-x': {
          '0%': { transform: 'scaleX(0)' },
          '100%': { transform: 'scaleX(1)' }
        },
        'slide-in': {
          '0%': { transform: 'translateX(-100%)' },
          '100%': { transform: 'translateX(0)' }
        }
      },
      animation: {
        'fade-up': 'fade-up 250ms ease-out both',
        'grow-y': 'grow-y 500ms cubic-bezier(0.22, 1, 0.36, 1) both',
        'grow-x': 'grow-x 600ms cubic-bezier(0.22, 1, 0.36, 1) both',
        'slide-in': 'slide-in 220ms cubic-bezier(0.22, 1, 0.36, 1) both'
      }
    }
  }
}
</script>
<style>
  :root { color-scheme: light; }
  html { scroll-behavior: smooth; }
  @keyframes page-in { from { opacity: 0; transform: translateY(14px) scale(.99) } to { opacity: 1; transform: none } }
  @keyframes reveal { from { opacity: 0; transform: translateY(18px) } to { opacity: 1; transform: none } }
  @keyframes row-in { from { opacity: 0; transform: translateX(-12px) } to { opacity: 1; transform: none } }
  @keyframes fade-in { from { opacity: 0 } to { opacity: 1 } }
  @keyframes fade-out { to { opacity: 0 } }
  @keyframes pop-in { from { opacity: 0; transform: translateY(20px) scale(.94) } to { opacity: 1; transform: none } }
  @keyframes pop-out { to { opacity: 0; transform: translateY(12px) scale(.96) } }
  @keyframes slide-out { to { transform: translateX(-100%) } }
  @keyframes toast-out { to { opacity: 0; transform: translateY(14px) scale(.96) } }
  @keyframes toast-in { from { opacity: 0; transform: translateY(22px) scale(.9) } to { opacity: 1; transform: none } }
  @keyframes drift { from { transform: translate3d(0,0,0) scale(1) } to { transform: translate3d(48px,-34px,0) scale(1.14) } }
  main .animate-fade-up { animation: page-in 460ms cubic-bezier(.22,1,.36,1) both; }
  .reveal { animation: reveal 560ms cubic-bezier(.22,1,.36,1) both; animation-delay: var(--d, 0ms); }
  .row-in { animation: row-in 420ms cubic-bezier(.22,1,.36,1) both; animation-delay: var(--d, 0ms); }
  .toast-in { animation: toast-in 380ms cubic-bezier(.34,1.56,.64,1) both; }
  .animate-drift { animation: drift 16s ease-in-out infinite alternate; }
  #modal-root > div { animation: fade-in 220ms ease-out both; }
  #modal-root > div > * { animation: pop-in 340ms cubic-bezier(.34,1.4,.64,1) both; }
  #modal-root > div.is-closing { animation: fade-out 170ms ease-in forwards; }
  #modal-root > div.is-closing > * { animation: pop-out 170ms ease-in forwards; }
  #mobile-menu:not(.hidden) { animation: fade-in 200ms ease-out both; }
  #mobile-menu.is-closing { animation: fade-out 200ms ease-in forwards; }
  #mobile-menu.is-closing aside { animation: slide-out 200ms cubic-bezier(.4,0,1,1) forwards; }
  button, a, select, input, textarea { transition: background-color .2s, border-color .2s, color .2s, box-shadow .2s, transform .15s; }
  button:not(:disabled):active { transform: scale(.96); }
  input:focus, select:focus, textarea:focus { box-shadow: 0 0 0 4px rgba(31,90,76,.12); }
  tbody tr { transition: background-color .15s; }
  .hover-lift { transition: transform .3s cubic-bezier(.22,1,.36,1), box-shadow .3s, border-color .3s; }
  .hover-lift:hover { transform: translateY(-3px); box-shadow: 0 12px 28px -14px rgba(17,52,44,.28); border-color: #c3ddd2; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
  }
  #print-root { display: none; }
  @media print {
    @page { size: A4 portrait; margin: 12mm; }
    body.print-residents #app { display: none !important; }
    body.print-residents #print-root { display: block; }
    body.print-residents { background: #fff; }
    #print-root thead { display: table-header-group; }
    #print-root tr { break-inside: avoid; }
    #print-root * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body class="h-full bg-cream font-sans text-slate-900 antialiased">
<div id="app"></div>
<script src="script.js?v=20261111-5"></script>
</body>
</html>
