<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f6f2">
<title>Barangay Migcanaway, Tangub City · Resident Survey and Assistance Tracking System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        pine: {
          50: '#f2f7f4',
          100: '#dfece6',
          200: '#c3ddd2',
          600: '#1f5a4c',
          700: '#17453b',
          800: '#11342c',
          900: '#0c2822'
        },
        cream: '#f7f6f2'
      },
      fontFamily: {
        sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'Segoe UI', 'sans-serif']
      },
      keyframes: {
        'fade-up': {
          '0%': { opacity: '0', transform: 'translateY(4px)' },
          '100%': { opacity: '1', transform: 'translateY(0)' }
        },
        'grow-y': {
          '0%': { transform: 'scaleY(0)' },
          '100%': { transform: 'scaleY(1)' }
        },
        'grow-x': {
          '0%': { transform: 'scaleX(0)' },
          '100%': { transform: 'scaleX(1)' }
        },
        'slide-in': {
          '0%': { transform: 'translateX(-100%)' },
          '100%': { transform: 'translateX(0)' }
        }
      },
      animation: {
        'fade-up': 'fade-up 250ms ease-out both',
        'grow-y': 'grow-y 500ms cubic-bezier(0.22, 1, 0.36, 1) both',
        'grow-x': 'grow-x 600ms cubic-bezier(0.22, 1, 0.36, 1) both',
        'slide-in': 'slide-in 220ms cubic-bezier(0.22, 1, 0.36, 1) both'
      }
    }
  }
}
</script>
<style>
  :root { color-scheme: light; }
</style>
</head>
<body class="h-full bg-cream font-sans text-slate-900 antialiased">

</body>
